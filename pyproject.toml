[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-toolkit"
version = "0.1.0"
description = "Rate limiting, health checks, telemetry, and integration for curl_cffi-based scrapers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "You" }]
dependencies = [
    "curl_cffi>=0.6.0",
    "selectolax>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crawler_toolkit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "network: tests that hit the real network (skipped by default)",
]
addopts = "-m 'not network'"
testpaths = ["tests"]