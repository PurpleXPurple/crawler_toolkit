<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <filter id="glowRed" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="88" fill="url(#bgGrad)"/>

  <circle cx="200" cy="200" r="130" fill="url(#centerGlow)"/>

  <circle cx="200" cy="200" r="155" fill="none"
          stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="200" cy="200" r="110" fill="none"
          stroke="#dc2626" stroke-width="12"
          opacity="0.22" filter="url(#glowSoft)"/>

  <circle cx="200" cy="200" r="110" fill="none"
          stroke="#ffffff" stroke-width="10"
          opacity="0.13"/>

  <path d="M 200 90 A 110 110 0 0 1 295.26 255"
        fill="none"
        stroke="url(#arcGrad)"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#glowRed)"/>

  <path d="M 200 90 A 110 110 0 0 1 295.26 255"
        fill="none"
        stroke="#dc2626"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.35">
    <animate attributeName="opacity"
             values="0.35;0.6;0.35"
             dur="3s" repeatCount="indefinite"/>
  </path>

  <line x1="200" y1="62" x2="200" y2="78"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <line x1="313" y1="265" x2="302" y2="259"
        stroke="#dc2626" stroke-width="2" stroke-linecap="round"
        filter="url(#glowRed)"/>

  <line x1="87" y1="265" x2="98" y2="259"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <circle cx="295.26" cy="255" r="9" fill="#dc2626"
          filter="url(#glowRed)">
    <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="295.26" cy="255" r="3.5" fill="#ffffff"/>

  <path d="M 238.89 161.11 A 55 55 0 1 0 238.89 238.89"
        fill="none"
        stroke="#ffffff"
        stroke-width="16"
        stroke-linecap="round"/>

  <line x1="238.89" y1="161.11" x2="252" y2="148"
        stroke="#ffffff" stroke-width="2.5"
        stroke-linecap="round" opacity="0.5"/>

</svg>